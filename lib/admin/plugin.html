<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <script>document.documentElement.dataset.theme=localStorage.getItem('admin-theme')||'auto'</script>
  <title>插件配置</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f0e8;--glow:#efd7b8;--panel:#fffdf9ed;--text:#27231e;--muted:#746c62;--line:#d8d0c5;--accent:#9a5c22;--accent-soft:#f2dfc8;--input:#fffaf2;--danger:#b53e35;--shadow:#6e563326}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#11100e;--glow:#392c20;--panel:#1c1a17ed;--text:#f2eee6;--muted:#aaa39a;--line:#38342f;--accent:#d6a76d;--accent-soft:#33271c;--input:#171512;--danger:#f1a7a0;--shadow:#0007}
    @media(prefers-color-scheme:dark){:root[data-theme="auto"]{color-scheme:dark;--bg:#11100e;--glow:#392c20;--panel:#1c1a17ed;--text:#f2eee6;--muted:#aaa39a;--line:#38342f;--accent:#d6a76d;--accent-soft:#33271c;--input:#171512;--danger:#f1a7a0;--shadow:#0007}}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% 8%,var(--glow),transparent 31rem),var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;transition:background .2s,color .2s}main{width:min(940px,calc(100% - 32px));margin:auto;padding:42px 0 70px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px}.back{color:var(--accent);text-decoration:none;font-weight:650}.theme{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 14px;cursor:pointer;border-radius:999px}.eyebrow{color:var(--accent);letter-spacing:.18em;text-transform:uppercase;font-size:12px}h1{margin:10px 0 9px;font:500 clamp(40px,7vw,68px)/.95 Georgia,serif;letter-spacing:-.04em}.plugin-id{color:var(--accent);font:13px Consolas,monospace}.lead{color:var(--muted);line-height:1.6;margin:12px 0 34px}.panel{border:1px solid var(--line);background:var(--panel);box-shadow:0 20px 70px var(--shadow);margin-top:22px}.panel-title{padding:23px 28px;border-bottom:1px solid var(--line)}h2{font:500 25px Georgia,serif;margin:0}.panel-title p{color:var(--muted);margin:7px 0 0}.row{display:grid;grid-template-columns:210px 1fr;gap:28px;padding:24px 28px;border-bottom:1px solid var(--line)}label{font-weight:650}label small{display:block;color:var(--muted);font-weight:400;margin-top:7px;line-height:1.45}input[type=text],input[type=password],textarea,select{width:100%;border:1px solid var(--line);background:var(--input);color:var(--text);padding:11px 12px;font:inherit;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}textarea{min-height:82px;resize:vertical;line-height:1.5}.rule{padding:22px 28px;border-bottom:1px solid var(--line)}.rule-head{display:grid;grid-template-columns:1fr 190px;gap:24px;align-items:center;margin-bottom:18px}.rule h3{margin:0 0 5px;font-size:16px}.path{font:13px Consolas,monospace;color:var(--accent)}.rule-fields{display:grid;grid-template-columns:1fr 1fr;gap:22px}.rule-fields label{font-size:13px;color:var(--muted)}footer{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 28px;border-top:1px solid var(--line);background:var(--panel);backdrop-filter:blur(15px)}.message{color:var(--muted)}.message.error{color:var(--danger)}.save{border:0;background:var(--accent);color:var(--bg);padding:12px 25px;font-weight:750;cursor:pointer}.empty{color:var(--muted);padding:26px 28px}@media(max-width:650px){main{padding-top:25px}.nav{margin-bottom:35px}.row,.rule-head,.rule-fields{grid-template-columns:1fr}.row,.rule,.panel-title,footer{padding-left:20px;padding-right:20px}footer{align-items:stretch;flex-direction:column}.save{width:100%}}
  </style>
</head>
<body><main><nav class="nav"><a class="back" href="/admin">← 返回插件目录</a><button class="theme" id="theme">主题：跟随系统</button></nav><header><div class="eyebrow">Plugin Configuration</div><h1 id="name">读取中</h1><div class="plugin-id" id="plugin-id"></div><p class="lead" id="description"></p></header><form id="form"><div id="content"><div class="panel"><div class="empty">正在读取插件配置...</div></div></div><footer><span class="message" id="message">配置尚未载入</span><button class="save" id="save" type="submit">保存全部配置</button></footer></form></main>
<script>
  const escapeHTML=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));const themes=['auto','light','dark'],labels={auto:'跟随系统',light:'浅色',dark:'深色'};const themeButton=document.querySelector('#theme');function applyTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('admin-theme',theme);themeButton.textContent='主题：'+labels[theme]}applyTheme(localStorage.getItem('admin-theme')||'auto');themeButton.onclick=()=>applyTheme(themes[(themes.indexOf(document.documentElement.dataset.theme)+1)%themes.length]);
  const pluginID=decodeURIComponent(location.pathname.split('/').filter(Boolean).at(-1));const form=document.querySelector('#form'),message=document.querySelector('#message'),saveButton=document.querySelector('#save');let definition;
  function renderField(field,value){const id='field-'+field.key,help=field.description?`<small>${escapeHTML(field.description)}</small>`:'';if(field.type==='boolean')return `<div class="row"><label for="${id}">${escapeHTML(field.label)}${help}</label><input id="${id}" name="${escapeHTML(field.key)}" type="checkbox" ${value?'checked':''}></div>`;const type=field.type==='password'?'password':'text',placeholder=field.type==='password'&&value?'已配置，留空则保留':(field.placeholder||''),displayed=field.type==='password'?'':(value||'');return `<div class="row"><label for="${id}">${escapeHTML(field.label)}${help}</label><input id="${id}" name="${escapeHTML(field.key)}" type="${type}" value="${escapeHTML(displayed)}" placeholder="${escapeHTML(placeholder)}" autocomplete="${type==='password'?'new-password':'off'}"></div>`}
  const modes=(selected,inherited)=>[['off',inherited?'继承插件规则':'关闭限制'],['whitelist','白名单'],['blacklist','黑名单']].map(([value,label])=>`<option value="${value}" ${selected===value?'selected':''}>${label}</option>`).join('');const lines=values=>(values||[]).join('\n');
  function renderRule(path,rule,inherited){const key=path==='default'?'default':path,title=path==='default'?'插件默认规则':path;return `<div class="rule" data-rule="${escapeHTML(key)}"><div class="rule-head"><div><h3>${escapeHTML(title)}</h3><div class="path">${path==='default'?'未覆盖的指令将使用此规则':escapeHTML(path)}</div></div><select name="mode">${modes(rule.mode||'off',inherited)}</select></div><div class="rule-fields"><label>用户 OpenID<textarea name="users" placeholder="每行一个用户 OpenID">${escapeHTML(lines(rule.users))}</textarea></label><label>群 OpenID<textarea name="groups" placeholder="每行一个群 OpenID">${escapeHTML(lines(rule.groups))}</textarea></label></div></div>`}
  function render(item){definition=item;document.title=item.name+' · 插件配置';document.querySelector('#name').textContent=item.name;document.querySelector('#plugin-id').textContent=item.id;document.querySelector('#description').textContent=item.description||'暂无插件说明';const settings=item.fields.length?item.fields.map(field=>renderField(field,item.values[field.key])).join(''):'<div class="empty">此插件没有自定义设置。</div>';const access=item.access||{default:{mode:'off'},commands:{}};document.querySelector('#content').innerHTML=`<section class="panel"><div class="panel-title"><h2>插件设置</h2><p>由插件声明的运行参数，保存后即时生效。</p></div>${settings}</section><section class="panel"><div class="panel-title"><h2>访问控制</h2><p>设置插件默认规则，或为单条指令单独覆盖。</p></div>${renderRule('default',access.default||{},false)}${item.commands.map(path=>renderRule(path,(access.commands||{})[path]||{mode:'off'},true)).join('')}</section>`;message.textContent='配置已载入'}
  form.addEventListener('input',()=>{message.textContent='有未保存的修改';message.classList.remove('error')});form.addEventListener('submit',async event=>{event.preventDefault();saveButton.disabled=true;message.textContent='正在保存...';message.classList.remove('error');const settings={};definition.fields.forEach(field=>{const input=form.elements[field.key];settings[field.key]=field.type==='boolean'?input.checked:input.value});const parseIDs=value=>value.split(/\r?\n|,/).map(item=>item.trim()).filter(Boolean);const access={default:null,commands:{}};form.querySelectorAll('[data-rule]').forEach(node=>{const rule={mode:node.querySelector('[name=mode]').value,users:parseIDs(node.querySelector('[name=users]').value),groups:parseIDs(node.querySelector('[name=groups]').value)},path=node.dataset.rule;if(path==='default')access.default=rule;else access.commands[path]=rule});try{if(definition.fields.length){const response=await fetch(`/admin/api/plugins/${encodeURIComponent(pluginID)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(settings)}),data=await response.json();if(!response.ok)throw new Error(data.error||'保存插件配置失败')}const response=await fetch(`/admin/api/plugins/${encodeURIComponent(pluginID)}/access`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(access)}),data=await response.json();if(!response.ok)throw new Error(data.error||'保存访问控制失败');form.querySelectorAll('input[type=password]').forEach(input=>{input.value='';input.placeholder='已配置，留空则保留'});message.textContent='配置已保存并即时生效'}catch(error){message.textContent=error.message;message.classList.add('error')}finally{saveButton.disabled=false}});
  fetch(`/admin/api/plugins/${encodeURIComponent(pluginID)}`).then(async response=>{if(!response.ok){const data=await response.json();throw new Error(data.error||'读取插件失败')}return response.json()}).then(render).catch(error=>{document.querySelector('#content').innerHTML=`<div class="panel"><div class="empty">${escapeHTML(error.message)}</div></div>`;message.textContent='载入失败';message.classList.add('error');saveButton.disabled=true});
</script></body></html>
