<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <script>document.documentElement.dataset.theme=localStorage.getItem('admin-theme')||'auto'</script>
  <title>Bot 管理面板</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f0e8; --glow:#efd7b8; --panel:#fffdf9e8; --text:#27231e; --muted:#746c62; --line:#d8d0c5; --accent:#9a5c22; --accent-soft:#f2dfc8; --shadow:#6e563326; }
    :root[data-theme="dark"] { color-scheme:dark; --bg:#11100e; --glow:#392c20; --panel:#1c1a17e8; --text:#f2eee6; --muted:#aaa39a; --line:#38342f; --accent:#d6a76d; --accent-soft:#33271c; --shadow:#0007; }
    @media(prefers-color-scheme:dark){:root[data-theme="auto"]{color-scheme:dark;--bg:#11100e;--glow:#392c20;--panel:#1c1a17e8;--text:#f2eee6;--muted:#aaa39a;--line:#38342f;--accent:#d6a76d;--accent-soft:#33271c;--shadow:#0007}}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% 8%,var(--glow),transparent 31rem),var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;transition:background .2s,color .2s} main{width:min(1040px,calc(100% - 32px));margin:auto;padding:60px 0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:40px}.eyebrow{color:var(--accent);letter-spacing:.18em;text-transform:uppercase;font-size:12px}h1{margin:10px 0 12px;font:500 clamp(42px,7vw,72px)/.95 Georgia,serif;letter-spacing:-.04em}.lead{color:var(--muted);margin:0;max-width:580px;line-height:1.6}.theme{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;cursor:pointer;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{display:block;padding:28px;border:1px solid var(--line);background:var(--panel);color:var(--text);text-decoration:none;box-shadow:0 18px 50px var(--shadow);transition:transform .18s,border-color .18s}.card:hover{transform:translateY(-3px);border-color:var(--accent)}.card-top{display:flex;justify-content:space-between;gap:18px;align-items:start}.index{font:500 13px Georgia,serif;color:var(--accent)}h2{margin:0;font:500 29px Georgia,serif}.id{margin-top:7px;color:var(--accent);font:12px Consolas,monospace}.description{color:var(--muted);line-height:1.55;min-height:48px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.tag{padding:6px 9px;background:var(--accent-soft);color:var(--accent);font-size:12px}.empty{color:var(--muted);border:1px dashed var(--line);padding:30px;grid-column:1/-1}@media(max-width:680px){main{padding:38px 0}.top{display:grid}.theme{justify-self:start}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main><div class="top"><div><div class="eyebrow">Bot Official / Admin</div><h1>插件目录</h1><p class="lead">每个插件拥有独立的配置空间，包括插件设置、指令和访问控制。</p></div><button class="theme" id="theme">主题：跟随系统</button></div><div class="grid" id="plugins"><div class="empty">正在读取插件...</div></div></main>
<script>
  const escapeHTML=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  const themes=['auto','light','dark'],labels={auto:'跟随系统',light:'浅色',dark:'深色'};const themeButton=document.querySelector('#theme');
  function applyTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('admin-theme',theme);themeButton.textContent='主题：'+labels[theme]}
  applyTheme(localStorage.getItem('admin-theme')||'auto');themeButton.onclick=()=>applyTheme(themes[(themes.indexOf(document.documentElement.dataset.theme)+1)%themes.length]);
  fetch('/admin/api/plugins').then(async response=>{if(!response.ok)throw new Error('读取插件失败');return response.json()}).then(plugins=>{const root=document.querySelector('#plugins');if(!plugins.length){root.innerHTML='<div class="empty">当前没有已注册插件。</div>';return}root.innerHTML=plugins.map((item,index)=>`<a class="card" href="/admin/plugins/${encodeURIComponent(item.id)}"><div class="card-top"><div><h2>${escapeHTML(item.name)}</h2><div class="id">${escapeHTML(item.id)}</div></div><span class="index">${String(index+1).padStart(2,'0')}</span></div><p class="description">${escapeHTML(item.description||'暂无插件说明')}</p><div class="meta"><span class="tag">${item.fields.length} 项设置</span><span class="tag">${item.commands.length} 条指令</span></div></a>`).join('')}).catch(error=>document.querySelector('#plugins').innerHTML=`<div class="empty">${escapeHTML(error.message)}</div>`);
</script></body></html>
